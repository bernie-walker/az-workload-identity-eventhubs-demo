# Tells the CSI driver which Key Vault secret to fetch and which Kubernetes secret to create from it.
# Must be in the same namespace as the pod that mounts it.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kafka-consumer-spc
  namespace: <namespace>
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "<client-id-of-your-managed-identity>"
    keyvaultName: "<key-vault-name>"
    tenantId: "<tenant-id>"
    objects: |
      array:
        - |
          objectName: evh-connection-string
          objectType: secret
          objectVersion: ""
  secretObjects:
    - secretName: evh-conn
      type: Opaque
      data:
        - objectName: evh-connection-string
          key: connection-string
